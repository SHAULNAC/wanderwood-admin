<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>WanderWood Admin | ניהול קטלוג מתקדם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background: #f0ede9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .admin-box { background: white; padding: 2.5rem; border-radius: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 100%; max-width: 550px; border: 1px solid #e5e7eb; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #bc986a; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6">

    <div class="admin-box">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-stone-800">WANDER<span class="text-[#bc986a]">WOOD</span></h1>
            <p class="text-stone-500 mt-2 font-medium">ניהול קטלוג והעלאת תמונות מרובות</p>
        </div>
        
        <form id="fullAdminForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-stone-700 mb-1">שם המוצר</label>
                <input type="text" id="name" class="w-full p-3 border border-stone-200 rounded-xl outline-none focus:border-[#bc986a] transition-all" placeholder="למשל: סט קוביות אלון" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-stone-700 mb-1">מחיר (₪)</label>
                    <input type="number" id="price" class="w-full p-3 border border-stone-200 rounded-xl outline-none focus:border-[#bc986a]" placeholder="350" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-stone-700 mb-1">מזהה (ID)</label>
                    <input type="text" id="id" class="w-full p-3 border border-stone-200 rounded-xl outline-none focus:border-[#bc986a]" placeholder="101">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-stone-700 mb-1">תיאור המוצר</label>
                <textarea id="description" class="w-full p-3 border border-stone-200 rounded-xl outline-none focus:border-[#bc986a]" rows="2" placeholder="ספר על המרקם, הגימור והשימוש..."></textarea>
            </div>

            <div class="p-6 bg-stone-50 rounded-2xl border-2 border-dashed border-stone-300 text-center hover:border-[#bc986a] transition-all group">
                <label class="block text-sm font-bold text-stone-700 mb-2 cursor-pointer">
                    <span class="block text-2xl mb-1 group-hover:scale-110 transition-transform">📸</span>
                    בחר תמונות מהמחשב
                    <span class="block text-xs font-normal text-stone-400 mt-1">(ניתן לבחור כמה תמונות יחד)</span>
                </label>
                <input type="file" id="imageFiles" accept="image/*" multiple class="block w-full text-sm text-gray-500 file:bg-stone-800 file:text-white file:rounded-full file:px-4 file:py-2 file:border-0 cursor-pointer">
            </div>
            
            <button type="submit" id="mainBtn" class="w-full bg-stone-800 text-white py-4 rounded-xl font-bold text-lg hover:bg-[#bc986a] transition-all shadow-lg active:scale-95 flex items-center justify-center">
                <span id="btnText">העלה מוצר לאתר</span>
            </button>
        </form>

        <div id="statusMessage" class="mt-6 p-4 rounded-xl text-center hidden font-bold"></div>
    </div>

    <script>
        // המפתחות שלך הוטמעו כאן
        const IMGBB_API_KEY = '5d561102b019920681529a9226113eaf'; 
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXn32HtQ7M1zt4aSvMzUqykPCGUBDaMu24aU2-mqrbErawzBmi_xzy_15RlOzJ2sId/exec'; 

        document.getElementById('fullAdminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('mainBtn');
            const btnText = document.getElementById('btnText');
            const status = document.getElementById('statusMessage');
            const files = document.getElementById('imageFiles').files;

            if (files.length === 0) {
                alert("נא לבחור לפחות תמונה אחת");
                return;
            }

            // עדכון כפתור למצב טעינה
            btn.disabled = true;
            status.classList.add('hidden');
            
            try {
                let imageUrls = [];
                
                // שלב 1: העלאת כל התמונות אחת אחת
                for (let i = 0; i < files.length; i++) {
                    btnText.innerHTML = `<span class="loading-spinner"></span> מעלה תמונה ${i+1} מתוך ${files.length}...`;
                    
                    const formData = new FormData();
                    formData.append('image', files[i]);

                    const imgResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST',
                        body: formData
                    });
                    const imgResult = await imgResponse.json();
                    
                    if (imgResult.success) {
                        imageUrls.push(imgResult.data.url);
                    }
                }

                // שלב 2: שליחה לגוגל שיטס
                btnText.innerHTML = `<span class="loading-spinner"></span> מעדכן קטלוג...`;
                
                const productData = {
                    name: document.getElementById('name').value,
                    price: document.getElementById('price').value,
                    description: document.getElementById('description').value,
                    image: imageUrls.join(','), // כל הקישורים מופרדים בפסיק
                    id: document.getElementById('id').value
                };

                // שליחה בפורמט JSON לגוגל
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });

                // הצלחה
                status.innerText = '✅ המוצר נוסף בהצלחה! התמונות יתחלפו אוטומטית באתר.';
                status.className = 'mt-6 p-4 rounded-xl text-center bg-green-100 text-green-800 font-bold block';
                document.getElementById('fullAdminForm').reset();

            } catch (err) {
                console.error(err);
                status.innerText = '❌ קרתה שגיאה: ' + err.message;
                status.className = 'mt-6 p-4 rounded-xl text-center bg-red-100 text-red-800 font-bold block';
            } finally {
                btn.disabled = false;
                btnText.innerText = 'העלה מוצר לאתר';
            }
        });
    </script>
</body>
</html>
